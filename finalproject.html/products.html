<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản Phẩm - SONIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 35%, #f8fafc 100%);
      color: #0f172a;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(90deg, #062247, #0369a1, #0284c7);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(6, 34, 71, 0.25);
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 2px;
    }
    .logo span { color: #7dd3fc; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; }
    nav a {
      color: #e0f2fe;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      transition: 0.25s;
    }
    nav a:hover, nav a.active {
      background: #ffffff;
      color: #062247;
    }

    .container { max-width: 1180px; margin: 40px auto; padding: 0 20px; }
    .blue-card {
      background: #ffffff;
      border: 1.5px solid #7dd3fc;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.08);
    }
    .blue-card h2 { color: #062247; margin-bottom: 14px; font-size: 22px; }
    .row { margin-bottom: 12px; }
    .row label { display: block; font-size: 13px; font-weight: 600; color: #0369a1; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #7dd3fc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: #f8fafc;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0284c7;
      background: #ffffff;
    }
    .btn-blue {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s;
    }
    .btn-blue:hover {
      background: #062247;
      transform: translateY(-2px);
    }

    .section-head { text-align: center; margin-bottom: 26px; }
    .section-head h2 { font-size: 28px; color: #062247; }
    .section-head p { color: #0284c7; font-size: 14px; font-weight: 600; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .product-card {
      background: #ffffff;
      border: 1.5px solid #bae6fd;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.09);
      transition: 0.3s;
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: #0284c7;
    }
    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background: #e0f2fe;
    }
    .product-meta { padding: 14px; background: #f0f9ff; }
    .product-cat { font-size: 11px; font-weight: 700; color: #0284c7; text-transform: uppercase; }
    .product-title { font-size: 15px; font-weight: 700; color: #062247; margin: 4px 0; }
    .product-price { font-size: 14px; font-weight: 700; color: #0369a1; }

    footer {
      background: linear-gradient(135deg, #041730, #062247);
      color: #bae6fd;
      text-align: center;
      padding: 24px;
      margin-top: 60px;
      font-size: 13px;
    }

    @media (max-width: 900px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px) {
      .products-grid { grid-template-columns: 1fr; }
      header { padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">SONIA<span>.</span></a>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="products.html" class="active">Sản phẩm</a>
      <a href="about.html">Giới thiệu</a>
      <a href="contact.html">Liên hệ &amp; Góp ý</a>
      <a href="account.html">Tài khoản</a>
    </nav>
  </header>

  <div class="container">
    <div class="blue-card">
      <h2>Thêm Sản Phẩm Mới (Lưu localStorage)</h2>
      <form id="productForm">
        <div class="row">
          <label>Tên sản phẩm *</label>
          <input type="text" id="pName" placeholder="VD: Áo Thun Xanh SONIA" required/>
        </div>
        <div class="row">
          <label>Danh mục *</label>
          <select id="pType">
            <option value="Quần áo">Quần áo</option>
            <option value="Giày dép">Giày dép</option>
            <option value="Phụ kiện">Phụ kiện</option>
          </select>
        </div>
        <div class="row">
          <label>Giá bán (VNĐ) *</label>
          <input type="number" id="pPrice" placeholder="VD: 250000" required/>
        </div>
        <div class="row">
          <label>Chọn hình ảnh *</label>
          <select id="pImg">
            <option value="../images/sp01.jpg">sp01.jpg — Áo thun xanh da trời</option>
            <option value="../images/sp02.jpg">sp02.jpg — Quần jean ống rộng xanh nhạt</option>
            <option value="../images/sp03.jpg">sp03.jpg — Áo khoác denim xanh xám</option>
            <option value="../images/sp04.jpg">sp04.jpg — Giày sneaker trắng</option>
          </select>
        </div>
        <button type="submit" class="btn-blue">Lưu Sản Phẩm</button>
      </form>
    </div>

    <div class="section-head">
      <h2>Danh Sách Sản Phẩm SONIA</h2>
      <p>Lưu trữ trực tiếp bằng localStorage</p>
    </div>
    <div class="products-grid" id="allProducts"></div>
  </div>

  <footer>© 2026 SONIA Fashion — Quần áo, Giày dép &amp; Phụ kiện</footer>
  <script src="js/main.js"></script>
</body>
</html>
